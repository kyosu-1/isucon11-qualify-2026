upstream app {
    server 127.0.0.1:3000;
    keepalive 128;
    keepalive_requests 1000000;
}

server {
    listen 443 ssl;

    # 既定の 1000 リクエストで HTTP/2 接続が GOAWAY され、処理中のストリームがベンチ側でエラーになる
    http2_max_requests 10000000;
    keepalive_requests 10000000;
    client_body_buffer_size 1m;

    ssl_certificate /etc/nginx/certificates/tls-cert.pem;
    ssl_certificate_key /etc/nginx/certificates/tls-key.pem;

    root /home/isucon/webapp/public;

    # 静的ファイルは nginx が直接返す（内容は変えない）
    location /assets/ {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
    location = /index.html {
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }
    # フロントエンドのルート（アプリの getIndex と同じ集合）
    location = / { rewrite ^ /index.html last; }
    location = /register { rewrite ^ /index.html last; }
    location ~ ^/isu/[^/]+(/condition|/graph)?$ { rewrite ^ /index.html last; }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_pass http://app;
    }
}
